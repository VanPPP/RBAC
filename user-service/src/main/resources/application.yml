server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taxi_user}
    username: ${DB_USER:taxi}
    password: ${DB_PASSWORD:taxi}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

taxi:
  jwt:
    secret: ${JWT_SECRET:taxi-dev-secret-key-min-32-chars-long!!}
    expiration-ms: 86400000
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key}
